name: Testahil continuous calibration

# Unattended by design, gated by design (11-Jul-2026):
#   - Drop OHLC into engine/raw_ohlc/{MARKET}/{TICKER}.csv and push (or run manually).
#   - Mechanical work (cleaning, panel rebuild, refit, LONO verdicts) always runs.
#   - The refit is committed straight to main whether or not it is material.
#     No PR, no approval step.
#   - A MATERIAL change [R-CAL-01, amended 23-Aug-2026] applies like any other
#     and is ANNOUNCED in three places: engine/PENDING_REVIEW/, the reasons
#     verbatim in the commit message, and the replaced config under `superseded`
#     in fitted_configs.json. See the commit step below, which implements this.
#   - The only red run is a market that RAISED: its production config is left
#     untouched, the healthy markets still apply, and the run ends red because
#     an exception is not evidence.
#
# THIS COMMENT USED TO SAY THE OPPOSITE -- "opens a PR ... nothing merges without
# a human clicking merge" -- for a day after the amendment landed in the body 20
# lines below it. A file that contradicts itself is read by whoever gets to the
# top of it first, which on 24-Aug-2026 was one of four forks making the same
# roll-forward request behave differently on two names in one sitting [R-RF-01].

# NO NIGHTLY SCHEDULE (removed 23-Aug-2026, user instruction). There is no live
# market feed here: engine/raw_ohlc/ changes only when a human posts a CSV, and
# posting already fires the push trigger below. A nightly cron therefore re-ran an
# identical fit on identical data and re-reported the same standing finding every
# night. Measured over 6-Aug..23-Aug-2026: 79 runs, of which 61 were push (correct
# — new data had arrived) and 18 were the cron (nothing had changed). Removing the
# cron is NOT what fixes a backlog of review PRs, and must not be sold as such: a
# material finding that is never adopted re-fires on EVERY trigger, which is how 66
# review PRs accumulated. Clearing the finding is the fix; this only stops the
# engine asking a question about data nobody touched.
on:
  push:
    paths:
      - 'engine/raw_ohlc/**.csv'
  workflow_dispatch: {}   # manual "run it now" button in the Actions tab

permissions:
  contents: write
  pull-requests: write

# Uploading a market's CSVs one file at a time creates one commit — and therefore one
# run — per file, each seeing a PARTIAL panel (1 name, then 2, then 3). Each of those
# correctly trips the materiality gate, which is right but noisy. Collapsing to the
# latest state means only the complete upload is judged.
concurrency:
  group: testahil-calibration
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pandas scipy

      - name: Run the continuous-learning pipeline
        id: refresh
        working-directory: engine
        run: |
          set +e
          python3 auto_refresh.py --apply
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
        # exit 0 = every touched market refit and applied (material or not)
        # exit 1 = at least one market RAISED — that market's production is untouched,
        #          the healthy ones still applied, and the run must end red

      - name: Smoke-test — the engine must actually IMPORT before anything is committed
        working-directory: engine
        run: |
          python3 -c "
          import market_profiles, mc_v3, panel_refresh, data_quality, auto_refresh
          from market_profiles import PROFILES
          for c,p in PROFILES.items():
              assert p.width_cal is not None, c
              assert p.nu is None or isinstance(p.nu,(int,float)), (c, p.nu)
          print('engine imports cleanly;', len(PROFILES), 'market profiles OK')
          "

      - name: Commit the refit, with the material reasons in the message
        run: |
          git config user.name "testahil-bot"
          git config user.email "info@testahil.com"

          # [R-CAL-01] ONE COMMIT PATH, MATERIAL OR NOT (23-Aug-2026). A material change
          # used to divert to a review branch and a PR. That gate produced 66 unmerged
          # PRs in 17 days which could not be accepted even in principle — they staged
          # only PENDING_REVIEW and panels, so merging one applied nothing — while 18
          # names across three markets sat outside any applied fit.
          #
          # The thing the gate existed to prevent was a change shipping SILENTLY. That is
          # answered here rather than by blocking: the reasons go in the commit message,
          # which is the announcement that reaches anyone reading `git log` without
          # knowing to look for an evidence file. auto_refresh writes them to
          # LAST_RUN_MATERIAL.txt; this reads them back.
          MATERIAL_FILE=engine/PENDING_REVIEW/LAST_RUN_MATERIAL.txt

          if git diff --quiet -- engine/ && [ -z "$(git status --porcelain engine/)" ]; then
            echo "Nothing changed."
            exit 0
          fi

          if [ -s "$MATERIAL_FILE" ]; then
            SUBJECT="Auto-refresh: MATERIAL calibration change applied ($(date -u +%Y-%m-%d))"
            BODY="$(printf 'Applied automatically and recorded, per R-CAL-01. What made it material:\n\n%s\n\nThe config each market replaced is under `superseded` in engine/fitted_configs.json.\nReverting THIS commit restores market_profiles.py and fitted_configs.json together.\nPer-market evidence is in engine/PENDING_REVIEW/.' "$(cat "$MATERIAL_FILE")")"
          else
            SUBJECT="Auto-refresh: non-material calibration update ($(date -u +%Y-%m-%d))"
            BODY="No market crossed a materiality threshold."
          fi

          rm -f "$MATERIAL_FILE"
          git add engine/
          git commit -m "$SUBJECT" -m "$BODY"

          # Retry against a moving main: the SEO and feed jobs also push here.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && break
            echo "push rejected (attempt $i) — retrying after rebase"
            sleep $((i * 5))
          done
          echo "$SUBJECT"

      - name: Fail the run if a market could not be refit
        if: steps.refresh.outputs.exit_code != '0'
        run: |
          # A nonzero exit no longer means "material" — material changes apply and are
          # announced. It now means a market RAISED. That market's production is
          # untouched and a PENDING_REVIEW/{MARKET}_{date}-ERROR.md carries the
          # traceback; the healthy markets were still applied and committed above.
          # This stays red because an exception is not evidence, and a crashed market
          # that looked green is how EG sat unprocessed for weeks in July.
          echo "::error::A market could not be refit — see engine/PENDING_REVIEW/*-ERROR.md. Its production config is unchanged; other markets were applied."
          exit 1
