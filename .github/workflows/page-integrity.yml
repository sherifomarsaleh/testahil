name: Page integrity check

# Added 27-Jul-2026 after a user found rmda.html rendering with no Monte
# Carlo section (a missing </details> had buried it inside the Technical
# accordion) and, on a full sweep, 5 more pages quietly publishing another
# ticker's valuation table (ihc.html showing Aramco's lenses, etc.) plus a
# 6th partially-cloned one the first pass of this same script missed
# (rmda.html carrying oriental-weavers' lens VALUES under RMDA's labels).
# See scripts/check_page_integrity.py for the full check list and how each
# one was validated against that exact historical bug before being trusted.
#
# Deliberately separate from deploy-pages.yml and does not block it: this
# check is brand new and static-analysis-only (no browser, doesn't confirm
# the page actually renders correctly at runtime — see the script's own
# docstring for that boundary). A red X here is a strong signal to look
# before the next push to main, not a hard gate on deployment.

on:
  push:
    paths:
      - 'legacy/assets/**'
      - 'scripts/check_legacy_assets_sync.py'
      - '**.html'
      - 'assets/data.js'
      - 'scripts/check_page_integrity.py'
      - 'scripts/check_data_freshness.py'
      - 'scripts/check_technical_read.py'
      - 'scripts/coverage_floor.py'
      - 'scripts/check_coverage_floor_negative_control.py'
      - 'engine/raw_ohlc/**'
  pull_request:
    paths:
      - '**.html'
      - 'assets/data.js'
      - 'scripts/check_page_integrity.py'
      - 'scripts/check_data_freshness.py'
      - 'scripts/check_technical_read.py'
      - 'scripts/coverage_floor.py'
      - 'scripts/check_coverage_floor_negative_control.py'
      - 'engine/raw_ohlc/**'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine deps
        run: pip install numpy pandas
      - name: Run page integrity check
        run: python3 scripts/check_page_integrity.py
      # [R-ENF-04] A gate must never report clean having examined nothing.
      # Measured 25-Aug-2026: with data.js emptied to a valid file holding zero
      # entries, all three gates below exited 0 and reported clean. This control
      # reinjects that exact condition and fails if any of them still does.
      - name: Coverage-floor negative control
        run: python3 scripts/check_coverage_floor_negative_control.py
      # Added 29-Jul-2026. A merge reconciling a concurrent branch silently
      # reverted 9 names' computed technical read and dropped their as-of
      # stamps three hours after they were adopted, and nothing noticed: the
      # rule lived only in the protocol prose. This step is that rule made
      # executable -- stamps present and coherent, technical read on the
      # current cleaned library, calendar-only horizons, published spot proven
      # against the library, sourced run_date, lifecycle invariant.
      - name: Run data freshness / provenance gate
        run: python3 scripts/check_data_freshness.py
      # Added 25-Aug-2026. A reader found gbco.html publishing a "Key levels"
      # table whose support sat ABOVE its own close, three lines under a
      # narrative quoting a different, correct ladder -- and clho.html with all
      # three resistances BELOW its close. Both steps above passed clean on
      # those pages that same day: they read data.js with regexes, `re.search`
      # takes the FIRST match, and a JavaScript object literal takes the LAST.
      # Both entries declared `levels` twice. This step hands data.js to node
      # and checks the object the BROWSER renders, then asserts the invariants
      # that were true of every correct page and false of those two.
      - name: Run technical-read coherence gate
        run: python3 scripts/check_technical_read.py

      # LEGACY/ IS SERVED CONTENT AND IT READS ITS OWN COPY OF data.js. The 30-Aug-2026
      # cutover left root ledger.html, picker.html, trade.html and portfolio.html as
      # redirect stubs, so the ONLY working copies of those four surfaces are the legacy
      # ones — and they load /legacy/assets/data.js, not the file every other gate here
      # inspects. This gate was written for exactly that on 30-Aug-2026 AND WAS WIRED
      # INTO NOTHING: measured 03-Sep-2026, it was the one gate in the repository invoked
      # by no workflow at all, and running it by hand found it RED.
      #
      # WHAT WAS LIVE WHILE NOTHING RAN IT: on 1 September the AMOC fair value was
      # reverted in assets/data.js to its PRE-CALIBRATION figure, because the standing
      # instruction is that nothing from the calibration campaign goes live one name at a
      # time. The revert reached assets/ and not the legacy mirror. For two days
      # testahil.com served 5.53/8.64/12.48 on /legacy/ and 4.09/5.95/8.52 on the new IA —
      # two different fair values for one company on one day, and the one on the public
      # ledger was the campaign number that was not supposed to be there. Verified against
      # the live site before it was fixed, not inferred from the repository.
      - name: legacy/assets must not drift from assets/ — six served surfaces read it
        run: python3 scripts/check_legacy_assets_sync.py
