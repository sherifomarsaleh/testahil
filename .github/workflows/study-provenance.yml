permissions:
  contents: read

concurrency:
  group: study-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pre-registration gate reads COMMIT ORDER, which a depth-1
          # checkout cannot answer. It refuses on a shallow clone rather than
          # reporting clean, so without this the job would be red by
          # construction — the permanently-red check [R-ENF-02] forbids.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # campaign_queue reads assets/data.js through a real JS engine rather than
      # by regex -- re.search takes the FIRST duplicate key and a JS object
      # literal takes the LAST, which is how a checker once inspected the half
      # the reader never saw [R-ENF-03].
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install engine deps
        run: pip install numpy pandas scipy python-docx openpyxl

      # VERIFY BY IMPORT, NOT BY PARSE. nu=Gaussian parsed cleanly and only died at
      # import, and that bug reached main while a regex check reported the file intact.
      - name: Import the modules the gate depends on
        run: |
          cd engine
          python3 -c "import wacc_builder, research_protocol, beta_regression, macro_path, cost_of_capital; print('imports OK')"
          python3 -c "
          import wacc_builder as w
          assert w.EXCHANGE_INDEX[('AE','DFM')] == 'FADGI', 'the DFM interim was changed without instruction'
          n = w.index_interim_note('AE','DFM')
          assert n and 'HELD OPEN BY INSTRUCTION, 23-Aug-2026' in n, 'the DFM hold note is missing'
          try:
              w.market_index_path('AE'); raise SystemExit('market_index_path(\"AE\") must refuse an ambiguous market')
          except ValueError:
              pass
          print('index registry OK — DFM interim intact, ambiguous market still refuses')
          "

      # [R-DOC-01] the two governing documents must carry the same standing rules,
      # and the same revision stamp
      - name: Protocol sync gate
        run: python3 scripts/check_protocol_sync.py

      # [R-ENF-01] the four defects that reached a reader on 23-Aug-2026, checked
      # mechanically before delivery instead of by the reader pasting the block back
      - name: Protocol text gate
        run: python3 scripts/check_protocol_text.py

      # [R-DOC-02] The text gate's own negative control: it restores the status claims
      # EXACTLY as they shipped and asserts each is caught, plus four clean sentences that
      # must NOT be. Written the same day the check was, because the first cut of the
      # status regex was drafted from the full protocol's phrasing and MISSED the digest's
      # own — "Committed on a feature branch with an open PR", the very sentence the rule
      # exists for. A check tested only against the example that inspired it is fitted to
      # one sentence. This runs in CI so the check cannot rot into a formality either.
      - name: Protocol text gate — negative control
        run: python3 scripts/check_protocol_text_negative_control.py

      # [R-ENF-02] the check a study cannot skip by not calling it
      - name: Study provenance gate
        run: python3 scripts/check_study_provenance.py

      # the lessons register, checked from outside itself: the
      # document must BE its generator's output, every id must resolve both
      # ways, every walk-forward run on disk must have produced a lesson, and
      # every registered class must be reachable. An empty register fails here
      # rather than passing quietly.
      - name: Lessons register gate
        run: python3 scripts/check_lessons_register.py

      # and the proof that gate can go red — it injects each defect it claims
      # to catch and fails if any is missed
      - name: Lessons register gate — negative control
        run: python3 scripts/check_lessons_register_negative_control.py

      # [R-TCAL-01] the technical calibration, checked from outside its own
      # builders: the per-name record must grade the technicals.py actually on
      # disk, its population must anchor off the OHLC libraries, the register
      # payload must BE its generator's output, and the delivered document may
      # cite no id that resolves to nothing. The orphan test caught a real
      # defect (a stale T-013) the day it was written.
      - name: Technical calibration gate
        run: python3 scripts/check_tech_calibration.py

      # and the proof that gate can go red — its own first run caught this
      # checker missing a half-lost record (one horizon deleted, name intact)
      - name: Technical calibration gate — negative control
        run: python3 scripts/check_tech_calibration_negative_control.py

      # the book-wide campaign's own record, checked from outside itself. The
      # queue must account for every covered name (queued + excluded == the
      # register's own total) and every walk-forward run on disk must carry a
      # frozen baseline AND a recorded fair value. Anchored on the run
      # directories, never on the record's own JSON, so a register that stopped
      # being fed FAILS rather than reporting clean [R-ENF-04]. Without this the
      # campaign would ship a gate that nothing outside it ever ran, which is
      # the defect [R-ENF-01] exists to close.
      - name: Campaign queue and fair-value register gate
        run: |
          python3 engine/campaign_queue.py
          python3 engine/fv_movement.py check

      # and the proof that gate can go red -- it reinjects a run with no frozen
      # baseline, a record with no run behind it, and an emptied population,
      # and fails if any of them is reported clean
      - name: Campaign register gate — negative control
        run: python3 scripts/check_campaign_register_negative_control.py

      # [R-GAP-01] the gate that looks at the ANSWER rather than the process. Every other
      # check in this job examines how a study was built; on 01-Sep-2026 all of them passed
      # a study whose central fair value sat 39% below the traded price with six modelling
      # defects behind it. A central more than 10% below the latest known price now requires
      # a dated review covering all eight headings, and a study whose committed numbers do
      # not even expose its answer FAILS rather than being skipped [R-ENF-04].
      - name: Valuation-gap gate
        run: python3 scripts/check_valuation_gap.py

      # and the proof that gate can go red — it reinjects an unreviewed breach, a review
      # that skips a heading, an unreadable answer, an emptied population and a vanished
      # study, plus three clean cases (including a central far ABOVE spot, which must NOT
      # fire: the rule is one-sided by instruction and a check going red where no rule
      # exists is the permanently-red check everyone learns to ignore)
      - name: Valuation-gap gate — negative control
        run: python3 scripts/check_valuation_gap_negative_control.py

      # [R-ENF-01] the DELIVERED WORKBOOK's shape, read off the file itself. On
      # 01-Sep-2026 the AMOC rebuild shipped seven sheets against the model report's
      # sixteen while its own compute.py attested structure_matches_model=True and
      # assert_model_study() passed on that boolean — a study's opinion of its work is
      # not a check. Every other gate in this job was looking at the workbook's contents;
      # none was looking at its shape.
      - name: Workbook-structure gate
        run: python3 scripts/check_workbook_structure.py

      # and the proof that gate can go red — it reinjects the seven-sheet workbook
      # exactly as it shipped, a renamed sheet, a right-names-wrong-order file, a study
      # with no workbook, one that will not open, a listed study that vanished and an
      # emptied population, plus three clean cases (among them a superseded off-standard
      # edition sitting beside a good current one, which must NOT fire)
      - name: Workbook-structure gate — negative control
        run: python3 scripts/check_workbook_structure_negative_control.py

      # [R-ENF-01] the OTHER half of the same attestation. The workbook gate above closed
      # structure_matches_model for the .xlsx and left the .docx self-certified — and on
      # 03-Sep-2026 three outside audits found exactly what that predicts: AMOC's Appendix
      # C stopped after C.3 (no cross-examination, no three-in-one-room, no divergence
      # table, all three required by name in depth-bar standard 7) and ARCC shipped with no
      # Headline, no Company overview, no About and no Disclosure. Both attested
      # structure_matches_model=True; neither was lying, nobody had counted. The section
      # list is read off the MODEL REPORT DOCUMENT, never typed here.
      - name: Document-structure gate
        run: python3 scripts/check_document_structure.py

      # and the proof it can go red — AMOC's truncated appendix and ARCC's missing front
      # and back matter exactly as they shipped, a single missing section, a right-sections
      # -wrong-order document, a document with no headings under either convention (which
      # must REFUSE, not report every section missing), a vanished study, an emptied
      # population, and the two records of the standard disagreeing; plus six clean cases,
      # among them both house heading conventions, numbers written '1.' rather than '1',
      # 'About this study' for 'About this series', and a study carrying EXTRA sections
      - name: Document-structure gate — negative control
        run: python3 scripts/check_document_structure_negative_control.py

      # [R-ENF-01] depth-bar standard 4 is implemented by every study as ITS OWN
      # hand-maintained list of forbidden words, and on 03-Sep-2026 EGCH's delivered
      # bibliography shipped "[R-MACRO-01]", "[R-LENS-03]" and "engine/macro_paths/EG.json"
      # while its own scrub reported 0 hits across 68 patterns. AMOC's scrub, which happens
      # to carry both shapes, caught the identical sentence the same hour, and a sweep found
      # three more documents leaking through three different holes. A list of forbidden
      # words cannot be complete, so a rule identifier and a repository path are matched by
      # SHAPE, from outside the studies, over all of them.
      - name: Delivered-vocabulary gate
        run: python3 scripts/check_delivered_vocabulary.py

      # and the proof it can go red — all four leaks exactly as they shipped, including
      # PHDC's inside a table cell, plus other shapes of the same defect, a vanished study,
      # an emptied population and a population with no documents; then four clean cases,
      # among them ordinary prose using register, gate, step and engine in their everyday
      # senses, and a bracketed [Note 14] that must NOT read as a rule identifier
      - name: Delivered-vocabulary gate — negative control
        run: python3 scripts/check_delivered_vocabulary_negative_control.py

      # [R-ENF-01] CLAUDE.md says of engine/research_sweep.py: "Import this rather than
      # hand-rolling a study-local sweep script." Sixteen studies do; ARCC did not, and what
      # its own version checked is the point — five real checks, all five passing, none of
      # them the module's eight invariants. Replaying the same 26 findings through
      # SweepRegister.validate() produced SEVEN errors, five of which were facts the study
      # already held and had written where no checker could point at them: a company website
      # attempted and REFUSED, an investor presentation cited by page for six drivers, the
      # reviewed half the bridge stands on, and three top-down drivers whose evidenced
      # absence sat in prose inside their own justification.
      - name: Sweep-module gate
        run: python3 scripts/check_sweep_module.py

      # and the proof it can go red — ARCC's hand-rolled register as it stood, a study that
      # imports the module for its ENUMS and never calls validate(), no sweep at all, a
      # register that will not parse, invariant failures the study does not NAME, a vanished
      # study and an emptied population; plus three clean cases including a study that names
      # its own open invariants, which is a gap written down rather than a gap hidden
      - name: Sweep-module gate — negative control
        run: python3 scripts/check_sweep_module_negative_control.py

      # "A NUMBER STATED IN PROSE MUST BE COMPUTED, NOT TYPED" has been standing since
      # 07-Aug-2026, and exactly one study implemented a check for it. What that cost was
      # measured in a single afternoon on studies that had just been rebuilt and passed
      # every other gate: AMOC's "514-basis-point range across four consecutive filed
      # periods", where the same sentence names five periods whose spread is 737 basis
      # points; four more typed period counts beside it, one of which summed five values
      # and divided by four; ARCC's masthead a day stale and its price date a month;
      # PHDC's three contradictory comments above one line. None is a modelling error and
      # every one reaches a reader, because a typed word does not look like a figure.
      #
      # The mechanism is now SHARED (engine/prose_figures.py) rather than copied — the
      # L-084 lesson from the same day, on the sweeps — and this gate requires each study
      # to carry it AND to PASS it. Counting a file's existence would put a green tick on
      # a red result.
      - name: Prose-figure gate
        run: python3 scripts/check_prose_figures.py

      # and the proof it can go red, including the shape that matters most: a study that
      # CARRIES the instrument while its own check is RED, which a gate testing only for
      # the file would have reported clean
      - name: Prose-figure gate — negative control
        run: python3 scripts/check_prose_figures_negative_control.py

      # EVERY TOTAL A READER SEES IS REPRODUCIBLE FROM THE ROWS PRINTED ABOVE IT.
      # Three defects were found in ARCC on 03-Sep-2026 by rendering the delivered PDF and
      # reading it page by page, all the same shape — a table printing components and a
      # figure that does not follow from them — in a document that had already passed the
      # recalculation gate, the prose-figure check, the scrub and the column audit. The
      # reason every one of those was blind is exact rather than an oversight in them:
      # recalculation reconciles the model TO ITSELF so a correct model passes however
      # wrong the page is, and prose_figures matches each figure individually while the
      # defect lives in the RELATIONSHIP BETWEEN figures. Nothing here was asking whether
      # a reader could add up what was printed.
      - name: Table-footing gate
        run: python3 scripts/check_table_footing.py

      # and the proof it can go red, on all three ARCC tables EXACTLY as they shipped —
      # plus the clean cases that caught two real bugs in the instrument's own first draft
      # (a header cell parsing 'FY2025' as 2025, and a dash walling off a component block)
      - name: Table-footing gate — negative control
        run: python3 scripts/check_table_footing_negative_control.py

      # THE PROPERTY THE WHOLE DESIGN RESTS ON, tested rather than assumed: a study
      # directory created tomorrow with nothing in it goes RED everywhere. That is a
      # property of the SYSTEM, so no individual gate can check it, and it is exactly the
      # claim this programme was asked to deliver — a study produced correctly and passing
      # several checks without anyone intervening. It is also true by construction right up
      # to the day a ratchet is seeded one entry too generously.
      #
      # Twelve DIRECTORY gates must refuse an empty study by name; two ARTEFACT gates are
      # tested by planting an offender, because a study with no documents cannot leak
      # vocabulary and demanding it fail would be a false claim; three are excluded with
      # their reasons, and an excluded gate that stops existing fails too.
      - name: New-study gauntlet
        run: python3 scripts/check_new_study_gauntlet.py

      # and its falsifier: a WEAKENED gate must break it. The weakening tested is the one
      # that would actually happen — a ratchet seeded with the unknown ticker, a one-line
      # edit anybody could make in good faith and which --prune would then preserve. Its
      # own first draft tried to blind a gate with a regex that matched nothing and reported
      # all three cases green, which is why every mutation now asserts that it landed and
      # the case count is asserted too.
      - name: New-study gauntlet — negative control
        run: python3 scripts/check_new_study_gauntlet_negative_control.py

      # THE LARGEST BLIND SPOT IN THE SYSTEM, and the gauntlet above cannot see it either:
      # every construction gate here takes a STUDY DIRECTORY as its subject, so a name with
      # no study directory is examined by NONE of them. Measured through a real node load of
      # the site's own data file: 90 published fair values, 22 with a study, 68 without —
      # the construction gates are SILENT about 76% of what this house publishes, not
      # passing it.
      #
      # The gap was known and written into a status note, which is a number that rots
      # [R-DOC-02]. This makes it a ratchet: countable, visible, and able to move in one
      # direction only. It does NOT demand the 68 be studied — that is Phase 2 and no gate
      # can demand 68 studies — it demands that no NEW fair value reach a reader with
      # neither a study nor an entry saying it has none.
      - name: Published-coverage gate
        run: python3 scripts/check_published_coverage.py

      # and its falsifier, whose first case is the only way this number grows: a new name
      # published with no study. Plus an absent data.js, one that parses and will not LOAD,
      # a site publishing no fair value at all, and no study directories — with two clean
      # cases including an unstudied name that is properly on the ratchet
      - name: Published-coverage gate — negative control
        run: python3 scripts/check_published_coverage_negative_control.py

      # [R-MACRO-01] one house macro path per market, and every study's growth
      # rates held to it from outside. Five studies carried five inflation rates
      # for one fiscal year in one country, three sovereign quotes and terminal
      # inflations of 5%, 7% and about 15%; each was defensible alone, and the
      # differences moved fair values by more than most of the driver work did.
      # The incoherence is DIRECTIONAL — escalating costs at domestic inflation
      # while holding the currency still inflates every cost and freezes every
      # price [L-048] — so this is not tidiness, it is bias removal. Ratcheted:
      # every study predating the path is listed and allowed to fail.
      - name: Macro-coherence gate
        run: |
          python3 engine/macro_path.py
          python3 scripts/check_macro_coherence.py

      # and the proof that gate can go red — it reinjects a typed growth rate, a
      # terminal real decline (PHDC's 12% against ~14.6%, AMOC's 5% against 7%),
      # a hand-set currency path (AMOC's 7.7% against 14.5% inflation), a quoted
      # terminal risk-free, an unconverged explicit window, a study setting its
      # own inflation, a new study with no record, an unparseable numbers file
      # and an emptied population — plus three clean cases including a STATED
      # real growth of 2%, which must NOT fire
      - name: Macro-coherence gate — negative control
        run: python3 scripts/check_macro_coherence_negative_control.py

      # the cost-of-capital reference the protocol has named since July 2026 and
      # which did not exist until 02-Sep-2026. GENERATED from the macro paths, so
      # it cannot state a figure its source no longer carries; regenerated here
      # and compared, byte for byte, with the copy on disk.
      - name: Cost-of-capital reference is its generator's output
        run: |
          cp engine/Cost_of_Capital_Reference.md /tmp/coc_committed.md
          python3 engine/build_coc_reference.py
          diff -q /tmp/coc_committed.md engine/Cost_of_Capital_Reference.md \
            || { echo 'FAIL — Cost_of_Capital_Reference.md is not what its generator produces; re-run engine/build_coc_reference.py and commit'; exit 1; }

      # [R-BRIDGE-01] the enterprise-to-equity bridge, read off each study's own
      # committed record. Four defects shipped inside arithmetic that recalculated
      # perfectly: a bridge standing on 31-Dec-2025 while a reviewed 31-Mar-2026
      # sheet sat on the company's own archive; the minority deducted at book
      # (CLHO) or not at all (PHDC) while dividing by parent shares; the same cash
      # charged twice, once in net-debt weights and once at face (AMOC); and lines
      # nobody outside the model ever added up.
      - name: Bridge-standard gate
        run: python3 scripts/check_bridge.py

      # and the proof that gate can go red — it reinjects all nine construction
      # defects plus a missing record, an unparseable file and an emptied
      # population, and four clean cases including NET weights with the cash NOT
      # re-added, which is legitimate and must NOT fire
      - name: Bridge-standard gate — negative control
        run: python3 scripts/check_bridge_negative_control.py

      # [R-LENS-03] the lens architecture. PHDC's central was a blend of four
      # lenses at typed weights, three of which value a developer on reported
      # accounting earnings and historical-cost book — a floor, not a value, for
      # a company whose worth sits in an undelivered order book carried at
      # historical cost. Its cash-flow lens landed within 2.2% of the market; the
      # blend landed 28% below. The weights had never cleared any out-of-sample
      # bar; they were chosen, written down and inherited.
      - name: Lens-architecture gate
        run: python3 scripts/check_lens_design.py

      # [R-ANCHOR-01] the forecast anchor. The rule that a near-term reviewed
      # actual outranks a stale full-year rate has been in both governing documents
      # since 07-Aug-2026, and on 03-Sep-2026 three studies in one market violated
      # it in three costumes, every one lowering the value, every one found by a
      # person reading the numbers. [L-048] was registered after the first
      # occurrence and bound nothing.
      - name: Forecast-anchor gate
        run: python3 scripts/check_forecast_anchor.py

      # and the proof it can go red -- eighteen conditions including AMOC's forecast
      # exactly as it stood, AMOC's mechanism contradicted by its own filings, and
      # EGCH's path, which the opening-year clause alone would have passed. Its
      # first run caught a bug in the gate's own tolerance.
      - name: Forecast-anchor gate — negative control
        run: python3 scripts/check_forecast_anchor_negative_control.py

      # [R-ENF-06] artefact currency. Three outside audits on 03-Sep-2026 returned
      # NOT DELIVERABLE on three re-struck studies for one reason: the re-strike
      # reached the valuation and not the paper. AMOC's case_adversarial.json was
      # read by three builders and written by NOTHING, and told a reader on page one
      # that conceding every contested charge reached a value BELOW the published
      # central. No gate could see it, because every gate reads study_numbers.json
      # and that file is not in it.
      - name: Artefact-currency gate
        run: python3 scripts/check_artefact_currency.py

      # and the proof it can go red. Its three headline cases are the three that
      # provoked the rule, rebuilt as they stood -- including ARCC's efg_bridge.json,
      # which the gate's OWN FIRST DRAFT could not see, because it carries its answer
      # under a key the value-key list did not know. A gate that does not catch its
      # own motivating case is not evidence.
      - name: Artefact-currency gate — negative control
        run: python3 scripts/check_artefact_currency_negative_control.py

      # and the proof that gate can go red — among its cases is PHDC's own
      # architecture exactly as it shipped. Its first run caught a real
      # inconsistency in the registry itself: a "clean" example using a lens the
      # class does not permit.
      - name: Lens-architecture gate — negative control
        run: python3 scripts/check_lens_design_negative_control.py

      # [R-COC-01] the cost-of-capital schedule. The sliding-schedule procedure has
      # been in both governing documents since 13-Jul-2026 and on 02-Sep-2026
      # exactly ONE study implemented it: PHDC and TMGH discount every explicit
      # year and the terminal alike at 26.25% and 32.37%, asserting that Egypt's
      # cost of capital never normalises while the central bank publishes a
      # disinflation path their own cost-of-debt assumptions already follow.
      - name: Cost-of-capital gate
        run: |
          python3 engine/cost_of_capital.py
          python3 scripts/check_cost_of_capital.py

      # and the proof that gate can go red — it reinjects the flat rate, two prices
      # for one date, the sovereign counted twice, a quoted terminal, a Kd below its
      # own sovereign (found in AMOC's committed record the day this was written),
      # a Kd resting on one period, an undescribed effective-rate denominator, a
      # non-monotone ladder and a missing premium basis
      - name: Cost-of-capital gate — negative control
        run: python3 scripts/check_cost_of_capital_negative_control.py

      # [R-ENF-05] the study audits its own ANSWER. Two instruments,
      # both aimed at a house that leans one way and cannot see it: the reverse
      # read (what the PRICE must believe, under the study's own drivers) and the
      # sign test on every contested judgement worth more than 5% of value. The
      # reverse read must stay OUT of the model — a rate solved from a price and
      # re-entering the valuation is the reverse-engineered terminal the protocol
      # prohibits, arriving through a side door — so the gate refuses any study
      # whose builders read the diagnostics file back in.
      - name: Output-records gate
        run: python3 scripts/check_output_records.py

      # and the proof that gate can go red — including a builder importing the
      # diagnostic, a judgement stated without its other framing, and a study
      # whose sign test FLAGS, which must stay GREEN: the flag is information, and
      # a gate that failed on it would push studies to resolve their judgements
      # inconsistently in order to stay green
      - name: Output-records gate — negative control
        run: python3 scripts/check_output_records_negative_control.py

      # [R-IND-01] — the escalation register. It re-checks every OPEN question
      # against every live ref, so the register cannot go on asking the principal
      # for something already supplied. It needs the branches to do that, hence
      # fetch-depth 0 on this job.
      - name: Escalation register
        run: python3 scripts/check_escalations.py

      # and the proof it goes red — the 3-Sep-2026 re-ask rebuilt exactly as it was
      # written, plus a search of one ref, a remembered failure with no re-run, and
      # an answer that lives nowhere. Three clean cases must stay GREEN, including
      # an empty register: nothing escalated is a legitimate state.
      - name: Escalation register — negative control
        run: python3 scripts/check_escalations_negative_control.py

      - name: Walk-forward actuation gate
        run: python3 scripts/check_walkforward_actuation.py

      - name: Walk-forward actuation gate — negative control
        run: python3 scripts/check_walkforward_actuation_negative_control.py

      - name: Fair-value vintage archive is current with the site
        run: python3 scripts/check_fv_vintages.py

      - name: Fair-value vintage archive — negative control
        run: python3 scripts/check_fv_vintages_negative_control.py

      - name: Point-in-time macro archive — negative control
        run: python3 scripts/check_macro_history_negative_control.py

      - name: Valuation-calibration pre-registration precedes every score
        run: python3 scripts/check_valuation_calibration.py

      - name: Valuation-calibration pre-registration — negative control
        run: python3 scripts/check_valuation_calibration_negative_control.py

      - name: Valuation-input block committed by every walk-forward
        run: python3 scripts/check_valuation_inputs.py

      - name: Valuation-input block — negative control
        run: python3 scripts/check_valuation_inputs_negative_control.py

      - name: Every calibrated name ships a complete edition
        run: python3 scripts/check_calibration_deliverables.py

      - name: Calibration deliverables — negative control
        run: python3 scripts/check_calibration_deliverables_negative_control.py

      - name: Lens architecture in the delivered documents
        run: python3 scripts/check_lens_vocabulary.py

      - name: Lens architecture in the documents — negative control
        run: python3 scripts/check_lens_vocabulary_negative_control.py

      # [R-TERM-01]. The reinvestment identity rr = g/ROIC collapses to
      # TV = [NOPAT - g.IC]/(W-g), so it charges g x IC for ever and the implied
      # replacement cycle is 1/g — the reciprocal of the INFLATION RATE, which is not a
      # fact about the asset. Nothing in that arithmetic is wrong, so every other gate
      # here passes it. The floor is a dominance argument with no parameters: a company
      # can always decline to invest and pay out instead, so TV >= NOPAT/W.
      - name: Terminal floor — a terminal is never worth less than not investing
        run: python3 scripts/check_terminal_floor.py

      - name: Terminal floor — negative control
        run: python3 scripts/check_terminal_floor_negative_control.py

      # VERIFY BY IMPORT, NOT BY PARSE — the standing rule. The shared terminal builder
      # must actually import, and its refusals must actually refuse.
      - name: The shared terminal builder imports and refuses what it promises to refuse
        run: |
          python3 -c "
          from engine.terminal_value import TerminalInputs, build, TerminalRefused
          import sys
          def refuses(msg, **kw):
              try:
                  build(TerminalInputs(**kw)); print('DID NOT REFUSE:', msg); sys.exit(1)
              except TerminalRefused:
                  print('refuses:', msg)
          base = dict(nopat=1000.0, wacc=0.18, inflation=0.07, dna_book=100.0,
                      ic_replacement=9000.0, useful_life_years=20.0,
                      useful_life_source='accounting-policies note', working_capital=500.0)
          # a life this desk chose is not a disclosed life
          refuses('an unsourced useful life', **dict(base, useful_life_source=''))
          # real growth with no capital behind it — the g x IC construction
          refuses('real growth with no incremental capital', **dict(base, real_growth=0.02))
          # a perpetuity that does not converge
          refuses('nominal growth above the terminal rate', **dict(base, inflation=0.30))
          t = build(TerminalInputs(**base))
          assert abs(t.nominal_growth - 0.07) < 1e-12, 'nominal growth must DERIVE'
          assert t.growth_capex == 0.0, 'zero real growth must cost zero growth capex'
          assert t.tv >= t.floor, 'a clean build must clear its own floor'
          print('terminal_value OK — nominal growth derives, zero real growth is free')
          "

      # [R-ENF-06] applied to the file the reader actually receives. Every other gate here
      # reads the .docx and the .xlsx, so a study can be rebuilt, re-checked and reported
      # clean while the delivered PDF still carries the previous edition's answer — which
      # is exactly what happened to four studies on 03-Sep-2026, for four hours, with
      # every gate green.
      # poppler-utils installed as its OWN step so a failure to install is a failure to
      # install, not a book-wide red from a gate that could not read anything. The gate
      # itself exits 2 with a message naming the missing tool if it is still absent.
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Delivered PDF carries the study's own answer
        run: python3 scripts/check_delivered_pdf_currency.py

      - name: Delivered PDF currency — negative control
        run: python3 scripts/check_delivered_pdf_currency_negative_control.py
