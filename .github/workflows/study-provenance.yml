name: Study provenance gate

# Added 23-Aug-2026. engine/research_protocol.py has held assert_beta_provenance(),
# assert_sigcm() and assert_model_study() since the composite-beta correction, and they
# work — but each study decided whether to CALL them, and most did not. A study passed by
# not checking itself. That is the same shape as the failure they were written to prevent:
# every study in the repo regressed against a composite of the covered names WHILE THE
# RULE AGAINST IT WAS ALREADY WRITTEN DOWN. A rule that does not execute is a wish.
#
# This job runs the check from OUTSIDE the studies, over all of them, so no study can opt
# out. It is a RATCHET, not a cliff: the 86 knowingly-outstanding studies in the rebuild
# queue are listed in engine/build_depth_audit/outstanding.json and are allowed to fail.
# The job fails only on a NEW violation — a study that was conforming and stopped being
# so, or a new study directory added with no gate at all. The list may only shrink.

