<script>
(function(){
  var parts=location.pathname.split('/').filter(Boolean);
  var k=decodeURIComponent(parts[parts.indexOf('test')+1]||"");
  k = ALL[k] ? k : (ALL[k.toUpperCase()] ? k.toUpperCase() : null);
  renderChrome("coverage");
  var root=document.getElementById("tl-root");
  if(!k){ root.innerHTML='<div class="wrap" style="padding:60px 0"><h1>No study found</h1><p class="muted">Browse <a href="/test/coverage.html">Coverage</a>.</p></div>'; return; }
  var D=ALL[k];
  document.title=D.name+" — 3 lenses (test)";
  function render(H,histStart){
    var dp=D.spot>=1000?0:D.spot>=100?1:2;
    var f=function(v){return Number(v).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp})};
    var hzs=Object.keys(D.dist||{});
    var k1=hzs.indexOf('t20')>-1?'t20':hzs[0], k3=hzs.indexOf('t60')>-1?'t60':hzs[hzs.length-1];
    var t1=D.dist[k1], t3=D.dist[k3];
    var fair=D.fair||{bear:t3.p5,base:t3.p50,full:t3.p95};
    var levels=D.levels||{res:[],sup:[]};
    var lo=Math.min(t3.p5,fair.bear,H.length?Math.min.apply(null,H):t3.p5);
    var hi=Math.max(t3.p95,fair.full,H.length?Math.max.apply(null,H):t3.p95);
    var pad=(hi-lo)*0.06, yMin=lo-pad, yMax=hi+pad;
    var yTop=14,yBot=486,x0=10,xNow=408.7,x1=472,x3=530.5,xFv=878;
    var y=function(v){return yTop+(yMax-v)/(yMax-yMin)*(yBot-yTop)};
    var pctY=function(v){return (v/520*100).toFixed(2)};
    var nice,grid=[];
    var divs=[5,6,7,4,8];
    for(var di=0;di<divs.length;di++){var step=(yMax-yMin)/divs[di];
      var mag=Math.pow(10,Math.floor(Math.log10(step)));
      nice=[1,2,2.5,5,10].map(function(kk){return kk*mag}).filter(function(kk){return kk>=step})[0]||mag*10;
      grid=[];
      for(var v=Math.ceil(yMin/nice)*nice;v<yMax;v+=nice) if(v>yMin) grid.push(+v.toFixed(6));
      if(grid.length>=5) break;}
    if(grid.length>5){var keep=[],gap=(grid.length-1)/4;for(var i=0;i<5;i++)keep.push(grid[Math.round(i*gap)]);grid=keep;}
    while(grid.length&&grid.length<5)grid.push(grid[grid.length-1]+nice);
    grid.sort(function(a,b){return b-a});
    var n=H.length;
    var hx=function(i){return x0+(n<2?0:(i/(n-1))*(xNow-x0))};
    var histD=n?H.map(function(v,i){return (i?'L':'M')+hx(i).toFixed(1)+','+y(v).toFixed(1)}).join(' '):'';
    var P=function(xa,ka){return xa+','+y(ka).toFixed(1)};
    var band=function(a,b){return [P(xNow,D.spot),P(x1,t1[a]),P(x3,t3[a]),P(x3,t3[b]),P(x1,t1[b]),P(xNow,D.spot)].join(' ')};
    var lines=function(arr){return arr.map(function(v){return 'M10,'+y(v).toFixed(1)+' H530.5'}).join(' ')};
    var res=(levels.res||[]).slice(0,3), sup=(levels.sup||[]).slice(0,3);
    var R=res.slice().sort(function(a,b){return b-a}), S=sup.slice().sort(function(a,b){return b-a});
    var above=res.filter(function(v){return v>D.spot}), below=sup.filter(function(v){return v<D.spot});
    var nearRes=above.length?Math.min.apply(null,above):Infinity;
    var nearSup=below.length?Math.max.apply(null,below):-Infinity;
    var gapPct=(fair.base/D.spot-1)*100;
    var clamp=function(v){return Math.max(2,Math.min(98,v))};

    var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    var medUp=t3.p50>D.spot;
    var bandPos=D.spot<t3.p25?'below the 25th percentile':D.spot>t3.p75?'above the 75th percentile':'inside the 25th–75th band';
    var verdict='The chart puts the next resistance at '+(isFinite(nearRes)?f(nearRes):'none of the published levels')+' and support at '+(isFinite(nearSup)?f(nearSup):'none of the published levels')+'. The engine\u2019s median at '+t3.label+' is '+f(t3.p50)+', '+(medUp?'above':'below')+' today, with the middle half between '+f(t3.p25)+' and '+f(t3.p75)+'. The study values it at '+f(fair.base)+' — '+Math.abs(gapPct).toFixed(1)+'% '+(gapPct>=0?'above':'below')+' the price.';
    var asOfLine=(D.asof&&D.asof.mc?'Odds as of '+d2(D.asof.mc.data):'')+(D.asof&&D.asof.tech?' · chart as of '+d2(D.asof.tech.data):'');
    var touch=(D.touch||[]).map(function(r){return '<div style="color:var(--tl-ink)">'+f(r[0])+'</div><div style="text-align:right;color:var(--tl-muted)">'+r[1]+'%</div><div style="text-align:right;color:var(--tl-teal2)">'+r[2]+'%</div>'}).join('');
    var gl=function(gi){return grid[gi]!=null?f(grid[gi]):''};
    var gp=function(gi){return grid[gi]!=null?pctY(y(grid[gi])):'-100'};

    '<p class="muted" style="margin:0 0 4px;max-width:70ch">Where the chart is now, the published odds to three months, and what the study says it is worth — on one axis.</p>'+
    '<p class="num" style="margin:0;font-size:var(--fs-caption);color:var(--tl-faint)">'+asOfLine+'</p>'+
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:9px;padding-bottom:4px"><a href="../study/" style="font-size:16px;font-weight:600">Detailed explanation of each analysis →</a>'+
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:11.5px;color:var(--tl-faint)">'+asOfLine+'</div></div></div>'+
    '<div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:16px;border-top:1px solid var(--tl-line);padding-top:16px">'+
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:25px;font-weight:600;color:var(--tl-gold)">'+f(D.spot)+' <span style="font-size:13px;font-weight:400;color:var(--tl-muted)">'+D.ccy+'</span></div>'+
      '<div style="font-size:13px;color:var(--tl-faint)">'+(D.spotDate||'')+'</div>'+
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:12.5px;color:var(--tl-muted);background:var(--tl-chipbg);border:1px solid var(--tl-line);border-radius:999px;padding:4px 12px;white-space:nowrap">'+(isFinite(nearRes)?'next resistance '+f(nearRes):'above all published resistance')+'</div>'+
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:12.5px;color:var(--tl-muted);background:var(--tl-chipbg);border:1px solid var(--tl-line);border-radius:999px;padding:4px 12px;white-space:nowrap">'+(isFinite(nearSup)?'nearest support '+f(nearSup):'below all published support')+'</div>'+
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:12.5px;color:var(--tl-muted);background:var(--tl-chipbg);border:1px solid var(--tl-line);border-radius:999px;padding:4px 12px;white-space:nowrap">fair value '+(gapPct>=0?'+':'−')+Math.abs(gapPct).toFixed(1)+'% vs price</div></div>'+
    '<div style="display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;align-items:start" id="tl-grid">'+
      '<div style="background:var(--tl-card);border:1px solid var(--tl-line);border-radius:16px;padding:20px 22px 16px">'+
        '<div style="display:flex;font-size:11.5px;letter-spacing:0.13em;text-transform:uppercase;color:var(--tl-faint);margin-bottom:10px">'+
          '<div style="width:42.6%">Now — <span style="color:var(--tl-muted)">the chart</span></div>'+
          '<div style="width:12.7%;color:var(--tl-teal)">1–3 mo — <span style="color:var(--tl-teal2)">published odds</span></div>'+
          '<div style="width:44.7%;color:var(--tl-gold3)">the study — <span style="color:var(--tl-gold2)">what it is worth</span></div></div>'+
        '<div style="position:relative;container-type:inline-size">'+

          '<g font-family="IBM Plex Mono, monospace" font-size="12">'+
            '<text x="10" y="506" fill="#5E7370">'+histStart+'</text>'+
            '<text x="408.7" y="506" fill="#E4B44C" text-anchor="middle" font-weight="600">TODAY</text>'+
            '<text x="472" y="506" fill="#5E7370" text-anchor="middle">'+t1.label+'</text>'+
            '<text x="530.5" y="506" fill="#5E7370" text-anchor="middle">'+t3.label+'</text>'+
            '<text x="896" y="506" fill="#5E7370" text-anchor="end">the study</text></g></svg>'+
        '<div style="position:absolute;inset:0;pointer-events:none;font-family:\'IBM Plex Mono\',monospace;font-size:1.25cqw;line-height:1">'+
          '<div style="position:absolute;left:94%;top:'+gp(0)+'%;transform:translateY(-50%);color:var(--tl-faint)">'+gl(0)+'</div>'+
          '<div style="position:absolute;left:94%;top:'+gp(1)+'%;transform:translateY(-50%);color:var(--tl-faint)">'+gl(1)+'</div>'+
          '<div style="position:absolute;left:94%;top:'+gp(2)+'%;transform:translateY(-50%);color:var(--tl-faint)">'+gl(2)+'</div>'+
          '<div style="position:absolute;left:94%;top:'+gp(3)+'%;transform:translateY(-50%);color:var(--tl-faint)">'+gl(3)+'</div>'+
          '<div style="position:absolute;left:94%;top:'+gp(4)+'%;transform:translateY(-50%);color:var(--tl-faint)">'+gl(4)+'</div>'+
          (R.length?'<div style="position:absolute;left:1.5%;top:'+pctY(y(R[0]))+'%;transform:translateY(calc(-100% - 4px));color:var(--tl-gold3);white-space:nowrap">resistance '+R.map(f).join(' · ')+'</div>':'')+
          (S.length?'<div style="position:absolute;left:1.5%;top:'+pctY(y(S[S.length-1]))+'%;transform:translateY(5px);color:var(--tl-tealsoft);white-space:nowrap">support '+S.map(f).join(' · ')+'</div>':'')+
          '<div style="position:absolute;left:55.9%;top:'+pctY(y(t3.p95))+'%;transform:translateY(-50%);color:var(--tl-tealdim);white-space:nowrap">'+f(t3.p95)+' p95</div>'+

      if(!series||series.length<10) return;

      var fd=function(iso){var p=iso.split('-');return (+p[2])+' '+MO[+p[1]-1]+' '+p[0]};
      render(H.map(function(o){return o.price}), fd(H[0].iso)+' – '+fd(H[H.length-1].iso));
