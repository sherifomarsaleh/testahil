<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Redirecting…</title>
<script src="/assets/data.js"></script>
<script>
(function(){
  var t=(new URLSearchParams(location.search).get("t")||"").trim();
  var K=null;
  if(t){ if(TICKERS[t]||METALS[t]) K=t; else if(TICKERS[t.toUpperCase()]) K=t.toUpperCase(); }
  location.replace(K ? "/test/"+encodeURIComponent(K)+"/study/" : "/test/coverage.html");
})();
</script>
</head>

</html>
